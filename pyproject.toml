[build-system]
requires = ["setuptools>=84"]
build-backend = "setuptools.build_meta"

[project]
name = "cobair"
# the version is set in setup.py from the release tag
dynamic = ["version"]
description = "CoBaIR is a Python library for Context Based Intention Recognition"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{name = "Adrian Lubitz", email = "Adrian.Lubitz@dfki.de"}]
keywords = ["intention recognition", "context", "human machine interaction", "robot", "bayesian"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Utilities",
]
requires-python = ">=3.10"
# The core is the config model only. Until the split into cobair.model / cobair.infer (#191)
# cobair.bayes_net needs the [infer] extra.
dependencies = [
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
infer = [
    "pgmpy==1.1.2",
    "bnlearn==1.1.0",
]
qt = [
    "PyQt5==5.15.11",
    "pyqtgraph==0.14.0",
]
web = [
    "cobair[infer]",
    # no python_version marker: on Python 3.10 installing [web] must fail, not skip reflex silently
    "reflex==0.10.1",
]
all = [
    "cobair[infer,qt,web]",
]

[project.scripts]
cobair-qt = "cobair.qt:main"
cobair-web = "cobair.web.launcher:main"

[project.urls]
Homepage = "https://github.com/dfki-ric/CoBaIR"
Documentation = "https://dfki-ric.github.io/CoBaIR/"
Changelog = "https://github.com/dfki-ric/CoBaIR/blob/main/CHANGELOG.md"
Issues = "https://github.com/dfki-ric/CoBaIR/issues"

[tool.setuptools]
# CoBaIR.py is the deprecated alias for the old import name, removed in 6.0.0 (#199)
py-modules = ["CoBaIR"]

[tool.setuptools.packages.find]
include = ["cobair*"]

[tool.setuptools.package-data]
"cobair.qt" = ["*.ui", "*.png"]
"cobair.web" = ["rxconfig.py", "examples/*.yml", "frontend/**/*"]

[tool.ruff]
# Keep in sync with the ruff pin in .github/workflows/quality.yml: preview rules change between releases.
required-version = "==0.17.3"
line-length = 100
extend-exclude = ["build", "site"]

[tool.ruff.lint]
select = ["E", "F", "W", "D", "DOC"]
preview = true

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.interrogate]
ignore-init-method = true
ignore-magic = true
ignore-private = true
ignore-module = false
fail-under = 0
exclude = ["build", "site", "docs", "scripts"]
verbose = 1

[tool.coverage.run]
# only the package, not the tests
source = ["cobair"]
# Reflex reads a copy of it in the runtime directory of `cobair-web`
omit = ["*/cobair/web/rxconfig.py"]
# data of the CI jobs is combined, their checkouts are in different directories
relative_files = true
# the end-to-end tests start `cobair-web`, which starts gunicorn, which forks the worker
parallel = true
patch = ["subprocess", "fork", "_exit"]
# the tests stop `cobair-web` with SIGTERM
sigterm = true

[tool.coverage.paths]
# the gunicorn processes of `cobair-web` run in a temporary directory and record absolute paths
source = ["cobair/", "*/cobair/"]
