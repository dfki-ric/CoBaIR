name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  run_tests:
    runs-on: ubuntu-latest
    # Debian bookworm images, bullseye is EOL and its apt repositories are gone
    container: python:${{ matrix.python-version }}-bookworm
    env:
      QT_QPA_PLATFORM: offscreen
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: pip-${{ matrix.python-version }}-${{ hashFiles('pyproject.toml', 'requirements/*.txt') }}
      # system libraries for the Qt configurator tests (offscreen platform)
      - run: apt-get update && apt-get install -y --no-install-recommends libgl1 libegl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libglib2.0-0
      - run: pip install --upgrade pip
      - run: pip install -r requirements/test_requirements.txt
      - run: pip install .[infer,qt]
      - run: coverage run -m pytest tests/ --html=test_report/report.html --junitxml=report.xml
      - run: |
          coverage report | tee coverage.txt
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat coverage.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
        if: always()
      - run: coverage xml && coverage html
        if: always()
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-reports-py${{ matrix.python-version }}
          path: |
            report.xml
            coverage.xml
            htmlcov
            test_report

  build_docu:
    runs-on: ubuntu-latest
    container: python:3.11-bookworm
    steps:
      - uses: actions/checkout@v7
      - run: pip install --upgrade pip
      - run: pip install -r requirements/doc_requirements.txt
      - run: pip install .[infer,qt]
      - run: mkdocs build
      - uses: actions/upload-artifact@v7
        with:
          name: site
          path: site

  build_installable_package:
    # on the runner (not in a container): Reflex needs curl/unzip to fetch bun for the frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install --upgrade pip build
      - run: pip install -e .[web]
      # the wheel ships the pre-built web GUI frontend
      - run: python -m cobair.web.build
      - run: python -m build
      - name: Check the wheel contains the frontend
        run: unzip -l dist/*.whl | grep -q 'cobair/web/frontend/index.html'
      - name: Serve the web GUI from the installed wheel (no Node.js)
        run: |
          python -m venv /tmp/wheel-venv
          /tmp/wheel-venv/bin/pip install "$(ls dist/*.whl)[web]"
          cd /tmp && PATH=/tmp/wheel-venv/bin:/usr/bin:/bin timeout 120 cobair-web --port 8123 --no-browser &
          for i in $(seq 1 60); do curl -sf http://localhost:8123/ping && break; sleep 2; done
          curl -sf -o /dev/null http://localhost:8123/
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist

  web_e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install --upgrade pip
      - run: pip install -r requirements/test_requirements.txt -e .[web] playwright==1.63.0
      - run: python -m cobair.web.build
      - run: python -m playwright install --with-deps chromium
      - run: pytest tests/web --html=test_report/report.html
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: web-e2e-report
          path: test_report
