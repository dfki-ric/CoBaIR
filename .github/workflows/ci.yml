name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  run_tests:
    runs-on: ubuntu-latest
    # Debian bookworm images, bullseye is EOL and its apt repositories are gone
    container: python:${{ matrix.python-version }}-bookworm
    env:
      QT_QPA_PLATFORM: offscreen
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: pip-${{ matrix.python-version }}-${{ hashFiles('pyproject.toml', 'requirements/*.txt') }}
      # system libraries for the Qt configurator tests (offscreen platform)
      - run: apt-get update && apt-get install -y --no-install-recommends libgl1 libegl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libglib2.0-0
      - run: pip install --upgrade pip
      - run: pip install -r requirements/test_requirements.txt
      - run: pip install .[infer,qt]
      - run: coverage run -m pytest tests/ --html=test_report/report.html --junitxml=report.xml
      - run: |
          coverage report | tee coverage.txt
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat coverage.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
        if: always()
      - run: coverage xml && coverage html
        if: always()
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-reports-py${{ matrix.python-version }}
          path: |
            report.xml
            coverage.xml
            htmlcov
            test_report

  build_docu:
    runs-on: ubuntu-latest
    container: python:3.11-bookworm
    steps:
      - uses: actions/checkout@v7
      - run: pip install --upgrade pip
      - run: pip install -r requirements/doc_requirements.txt
      - run: pip install .[infer,qt]
      - run: mkdocs build
      - uses: actions/upload-artifact@v7
        with:
          name: site
          path: site

  build_installable_package:
    # on the runner (not in a container): Reflex needs curl/unzip to fetch bun for the frontend build
    runs-on: ubuntu-latest
    env:
      # CPU-only torch (pulled in by pgmpy/bnlearn), the CUDA wheels fill the runner's disk
      PIP_EXTRA_INDEX_URL: https://download.pytorch.org/whl/cpu
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install --upgrade pip build
      - run: pip install -e .[web]
      # the wheel ships the pre-built web GUI frontend
      - run: python -m cobair.web.build
      - run: python -m build
      - name: Check the wheel contains the frontend
        run: unzip -l dist/*.whl | grep -q 'cobair/web/frontend/index.html'
      - name: Install the wheel in a clean venv
        run: |
          python -m venv /tmp/wheel-venv
          /tmp/wheel-venv/bin/pip install --upgrade pip
          if ! /tmp/wheel-venv/bin/pip install "$(ls dist/*.whl)[web]" > pip.log 2>&1; then
            cat pip.log
            python -c "t = open('pip.log', errors='replace').read()[-3000:]; print('::error title=pip install of the wheel::' + t.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))"
            exit 1
          fi
      - name: Serve the web GUI from the installed wheel (no Node.js)
        run: |
          (cd /tmp && PATH=/tmp/wheel-venv/bin:/usr/bin:/bin timeout 300 cobair-web --port 8123 --no-browser > /tmp/cobair-web.log 2>&1 &)
          for i in $(seq 1 90); do curl -sf -o /dev/null http://localhost:8123/ping && curl -sf -o /dev/null http://localhost:8123/ && exit 0; sleep 2; done
          cat /tmp/cobair-web.log
          # annotations are readable without the log; %, CR and LF must be escaped
          python -c "import sys; t = open('/tmp/cobair-web.log', errors='replace').read()[-3000:]; print('::error title=cobair-web from the wheel::' + t.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))"
          exit 1
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist

  web_e2e:
    runs-on: ubuntu-latest
    env:
      # CPU-only torch (pulled in by pgmpy/bnlearn), the CUDA wheels fill the runner's disk
      PIP_EXTRA_INDEX_URL: https://download.pytorch.org/whl/cpu
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install --upgrade pip
      - run: pip install -r requirements/test_requirements.txt -e .[web] playwright==1.63.0
      - run: python -m cobair.web.build
      - run: python -m playwright install --with-deps chromium
      - name: Run web tests (fail instead of skip)
        env:
          COBAIR_REQUIRE_E2E: "1"
        run: |
          pytest tests/web -rs --html=test_report/report.html | tee pytest.txt
          echo "::notice title=web tests::$(tail -1 pytest.txt)"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: web-e2e-report
          path: test_report

  hf_space_image:
    # the Docker image of the Hugging Face Space, built from the wheel of build_installable_package
    needs: build_installable_package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: space/dist
      - run: cp deploy/hf-space/Dockerfile deploy/hf-space/README.md space/
      - run: docker build -t cobair-space space
      - name: Serve the web GUI from the image
        run: |
          docker run -d --name space -p 7860:7860 cobair-space
          for i in $(seq 1 90); do curl -sf -o /dev/null http://localhost:7860/ping && curl -sf -o /dev/null http://localhost:7860/ && exit 0; sleep 2; done
          docker logs space > space.log 2>&1
          cat space.log
          python -c "t = open('space.log', errors='replace').read()[-3000:]; print('::error title=Space image::' + t.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))"
          exit 1
