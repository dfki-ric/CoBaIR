name: release
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

jobs:
  upload_pypi:
    # on the runner (not in a container): Reflex needs curl/unzip to fetch bun for the frontend build
    runs-on: ubuntu-latest
    env:
      # CPU-only torch (pulled in by pgmpy/bnlearn), the CUDA wheels fill the runner's disk
      PIP_EXTRA_INDEX_URL: https://download.pytorch.org/whl/cpu
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install build twine
      # the wheel ships the pre-built web GUI frontend
      - run: pip install -e .[web]
      - run: python -m cobair.web.build
      # setup.py takes the version from the tag (GITHUB_REF_NAME)
      - run: python -m build
      - run: twine upload --verbose dist/*
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
