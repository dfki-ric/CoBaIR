name: release
# Publishing a GitHub Release (tag 5.0.0 or v5.0.0) uploads the package to PyPI and attaches it to the release.
on:
  release:
    types: [published]

jobs:
  build:
    # on the runner (not in a container): Reflex needs curl/unzip to fetch bun for the frontend build
    runs-on: ubuntu-latest
    env:
      # CPU-only torch (pulled in by pgmpy/bnlearn), the CUDA wheels fill the runner's disk
      PIP_EXTRA_INDEX_URL: https://download.pytorch.org/whl/cpu
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install build twine
      # the wheel ships the pre-built web GUI frontend
      - run: pip install -e .[web]
      - run: python -m cobair.web.build
      # setup.py takes the version from the tag (GITHUB_REF_NAME, without a leading v)
      - run: python -m build
      - run: twine check --strict dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  upload_pypi:
    needs: build
    runs-on: ubuntu-latest
    # PyPI Trusted Publishing: the project cobair on pypi.org trusts this workflow in the environment pypi
    environment:
      name: pypi
      url: https://pypi.org/project/cobair/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      # without the secret PYPI_API_TOKEN the action uses Trusted Publishing
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}

  attach_to_release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - run: gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
