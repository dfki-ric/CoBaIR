name: publish_docu
on:
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deploy:
    # on the runner, not in a container: in a container the checkout belongs to another user
    # than root, and git refuses to work there ("not in a git directory")
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # gh-deploy needs the gh-pages branch
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install --upgrade pip
      - run: pip install --group docs .[infer,qt]
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - run: mkdocs gh-deploy --force --strict
